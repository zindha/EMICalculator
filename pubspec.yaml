name: emi_calculator
description: "EMI Calculator - Smart Loan Planner. Compare, Save, Pay Faster."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  google_fonts: 6.2.1
  dynamic_color: ^1.7.0
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Export
  pdf: ^3.11.1
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^5.0.0

  # Analyzer (compatible with the SDK and other code-generation packages)
  analyzer: ^6.4.1

  # App Icon & Splash Screen Generation
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  image_path: "app-icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "app-icon.png"
  windows:
    generate: true
    image_path: "app-icon.png"
  macos:
    generate: true
    image_path: "app-icon.png"

flutter_native_splash:
  image: assets/images/app_icon.png
  color: "#FFFFFF"
  color_dark: "#1A1A2E"
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#1A1A2E"
    image: assets/images/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
